<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<title>Mi Plan Mensual</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Paleta editorial — crema, tinta, acentos suaves */
  --bg:#F5F2EC;          /* fondo crema */
  --card:#FBFAF7;        /* tarjetas casi blanco cálido */
  --tx:#1C1A17;          /* tinta casi negra */
  --mu:#8A8378;          /* texto secundario topo */
  --br:rgba(28,26,23,.10);
  --ink:#1C1A17;         /* botones oscuros */
  --ink-soft:#2E2A25;
  /* Acentos apagados */
  --v:#4A5D3F;           /* verde oliva profundo */
  --vd:#37452F;
  --vl:#E8EDE5;          /* verde muy claro */
  --vm:#6E8460;
  --am:#8A6D3B;          /* ámbar tierra */
  --al:#F5EFE0;
  --bl:#E5E9EE;
  --pl:#F2E9E4;
  --danger:#8B4444;
  --danger-l:#F5E3E3;
  --rad:4px;             /* esquinas casi rectas */
  --rsm:2px;
  --pill:100px;          /* botones píldora */
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;-webkit-font-smoothing:antialiased;}
::selection{background:var(--ink);color:var(--bg);}
.hdr{background:var(--bg);padding:3.5rem 1.5rem 2rem;position:relative;border-bottom:1px solid var(--br);}
.hc{position:relative;z-index:1;max-width:1040px;margin:0 auto;}
.htag{display:inline-block;color:var(--mu);font-size:10px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;margin-bottom:1.5rem;}
.hdr h1{font-family:'DM Serif Display',serif;font-size:clamp(34px,7vw,64px);color:var(--tx);line-height:1.02;margin-bottom:1rem;letter-spacing:-.02em;}
.hdr h1 em{font-style:italic;}
.hdr p{color:var(--mu);font-size:14px;line-height:1.6;max-width:520px;}
.hmacros{display:flex;gap:10px;margin-top:2rem;flex-wrap:wrap;}
.hmacro{background:var(--card);border:1px solid var(--br);border-radius:var(--rad);padding:14px 20px;text-align:left;min-width:96px;}
.hmacro .val{font-family:'DM Serif Display',serif;font-size:24px;font-weight:400;color:var(--tx);line-height:1;}
.hmacro .lbl{font-size:10px;color:var(--mu);margin-top:5px;letter-spacing:.08em;text-transform:uppercase;}
.mbar{background:var(--bg);border-bottom:1px solid var(--br);padding:1rem;}
.mbar-inner{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.mbar label{font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);white-space:nowrap;}
.mchips{display:flex;gap:5px;flex-wrap:wrap;}
.mchip{padding:6px 14px;border-radius:var(--pill);border:1px solid var(--br);font-size:11px;font-weight:500;cursor:pointer;background:transparent;color:var(--mu);transition:all .2s;letter-spacing:.02em;}
.mchip:hover{border-color:var(--ink);color:var(--ink);}
.mchip.active{background:var(--ink);color:var(--bg);border-color:var(--ink);}
.sbnr{max-width:960px;margin:.4rem auto 0;padding:0 1rem;display:flex;gap:5px;flex-wrap:wrap;}
.sbadge{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:600;}
.sb-f{background:#E1F5EE;color:#085041;}.sb-v{background:#E6F1FB;color:#0C447C;}
.nav-wrap{background:var(--bg);border-bottom:1px solid var(--br);position:sticky;top:0;z-index:100;backdrop-filter:blur(8px);}
.nav{display:flex;max-width:1040px;margin:0 auto;overflow-x:auto;scrollbar-width:none;gap:2px;}
.nav::-webkit-scrollbar{display:none;}
.nbtn{padding:16px 18px;border:none;background:none;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:400;color:var(--mu);cursor:pointer;white-space:nowrap;border-bottom:1px solid transparent;transition:all .25s;letter-spacing:.01em;}
.nbtn:hover{color:var(--ink);}
.nbtn.active{color:var(--ink);border-bottom-color:var(--ink);font-weight:500;}
.main{max-width:1040px;margin:0 auto;padding:3rem 1.5rem 5rem;}
.sec{display:none;}.sec.active{display:block;animation:fadeIn .4s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.stitle{font-family:'DM Serif Display',serif;font-size:clamp(28px,4vw,42px);margin-bottom:.5rem;line-height:1.1;letter-spacing:-.015em;}
.ssub{font-size:14px;color:var(--mu);margin-bottom:2.5rem;line-height:1.7;max-width:580px;}
.wkt{font-family:'DM Serif Display',serif;font-size:22px;margin-bottom:1rem;letter-spacing:-.01em;}
.wkd{height:1px;background:var(--br);margin:2.5rem 0;}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:2rem;}
.cal-hd{text-align:left;font-size:9px;font-weight:500;color:var(--mu);padding:6px 4px;text-transform:uppercase;letter-spacing:.14em;}
.cal-day{background:var(--card);border:1px solid var(--br);border-radius:var(--rad);padding:10px 8px;min-height:158px;position:relative;transition:border-color .2s;}
.cal-day:hover{border-color:rgba(28,26,23,.22);}
.cal-day.gym{border-left:3px solid var(--v);}.cal-day.mov{border-left:3px solid var(--am);}.cal-day.rest{border-left:3px solid #D3D1C7;}
.cal-day.q1{background:#FDFFFE;}.cal-day.q2{background:#FFFDF8;}
.dnum{font-family:'DM Serif Display',serif;font-size:17px;font-weight:400;line-height:1;}
.q1 .dnum{color:var(--tx);}.q2 .dnum{color:var(--am);}
.chip{display:block;font-size:9px;padding:4px 7px;border-radius:var(--rsm);margin-bottom:3px;cursor:pointer;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all .18s;letter-spacing:.01em;}
.chip:hover{transform:translateX(2px);}
.chip-d{background:var(--vl);color:var(--vd);}
.chip-m{background:var(--al);color:var(--am);}
.chip-m2{background:var(--pl);color:#7A5A50;}
.chip-a{background:var(--bl);color:#40506B;}
.chip-c{background:#EFE9E3;color:#6B5D52;}
.chip-portatil{outline:1.5px solid var(--am);outline-offset:-1.5px;font-weight:600;}
/* Etiqueta de tipo de entrenamiento */
.cal-day-top{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px;}
.entreno-tag{
  font-size:7.5px;font-weight:500;letter-spacing:.1em;
  padding:3px 6px;border-radius:var(--pill);white-space:nowrap;
  text-transform:uppercase;line-height:1;
}
.entreno-v{background:var(--vl);color:var(--vd);}
.entreno-am{background:var(--al);color:var(--am);}
.entreno-mu{background:rgba(28,26,23,.05);color:var(--mu);}
.entreno-hora{font-size:8.5px;color:var(--mu);letter-spacing:.04em;margin-bottom:6px;margin-top:-4px;}
/* Celdas vacías y extra */
.cal-day-vacia{background:transparent;border:none;min-height:auto;}
.cal-day-extra{background:transparent;border:1px dashed var(--br);}
.dico{display:none;}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:2rem;padding:14px 18px;background:var(--card);border:1px solid var(--br);border-radius:var(--rad);}
.li{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mu);letter-spacing:.02em;}
.legend{gap:14px 20px;}
.ld{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.overlay{display:none;position:fixed;inset:0;background:rgba(28,26,23,.42);z-index:300;align-items:center;justify-content:center;padding:1.5rem;backdrop-filter:blur(3px);}
.overlay.open{display:flex;}
.modal{background:var(--card);border-radius:var(--rad);max-width:560px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 30px 90px rgba(28,26,23,.18);}
.mtop{padding:1.75rem 2rem 1.25rem;display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--br);}
.mtop h3{font-family:'DM Serif Display',serif;font-size:26px;line-height:1.15;letter-spacing:-.01em;}
.mmeta{font-size:11px;color:var(--mu);margin-top:8px;letter-spacing:.04em;}
.mclose{background:none;border:none;font-size:18px;cursor:pointer;color:var(--mu);padding:0 0 0 14px;flex-shrink:0;line-height:1;transition:color .2s;}
.mclose:hover{color:var(--ink);}
.mbody{padding:1.5rem 2rem 2rem;}
.rlabel{font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:.16em;color:var(--mu);margin:1.75rem 0 .75rem;}
.ing-row{display:flex;justify-content:space-between;font-size:13px;padding:9px 0;border-bottom:1px solid var(--br);}
.ing-row:last-child{border-bottom:none;}
.ing-qty{color:var(--mu);font-weight:400;font-variant-numeric:tabular-nums;}
.step-item{display:flex;gap:14px;font-size:13px;margin-bottom:14px;line-height:1.65;}
.snum{min-width:22px;height:22px;border-radius:50%;background:transparent;border:1px solid var(--br);color:var(--mu);font-size:10px;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.rtip{background:var(--vl);padding:14px 18px;font-size:12px;color:var(--vd);margin-top:1.5rem;line-height:1.65;border-radius:var(--rad);}
.rsust{background:var(--al);padding:14px 18px;font-size:12px;color:var(--am);margin-top:10px;line-height:1.65;border-radius:var(--rad);}
.rec-badge{display:inline-block;font-size:9px;font-weight:500;padding:5px 12px;border-radius:var(--pill);margin-bottom:1rem;letter-spacing:.12em;text-transform:uppercase;}
.rmeta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:1.25rem;}
.rpill{font-size:11px;background:transparent;border:1px solid var(--br);padding:5px 12px;border-radius:var(--pill);color:var(--mu);letter-spacing:.02em;}
.rec-idx-card{background:var(--card);border:1px solid var(--br);border-radius:var(--rad);margin-bottom:6px;overflow:hidden;cursor:pointer;}
.rec-idx-inner{display:flex;justify-content:space-between;align-items:flex-start;padding:.8rem 1rem;}
.rec-idx-inner:hover{background:var(--bg);}
.ex-week{margin-bottom:2rem;}
.ex-wt{font-family:'DM Serif Display',serif;font-size:20px;margin-bottom:.2rem;}
.ex-ws{font-size:12px;color:var(--mu);margin-bottom:1rem;}
/* Bloque de día — estilo tarjeta con header */
.ex-bloque{background:var(--card);border:1px solid var(--br);border-radius:var(--rad);overflow:hidden;margin-bottom:8px;transition:border-color .2s;}
.ex-bloque:hover{border-color:rgba(28,26,23,.18);}
.ex-bloque-header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;cursor:pointer;user-select:none;transition:background .2s;}
.ex-bloque-header:hover{background:rgba(28,26,23,.02);}
.ex-bloque-left{display:flex;align-items:center;gap:10px;}
.ex-bloque-emoji{font-size:17px;opacity:.85;}
.ex-bloque-title{font-size:15px;font-weight:700;}
.ex-bloque-sub{font-size:11px;color:var(--mu);margin-top:1px;}
.ex-bloque-meta{display:flex;align-items:center;gap:8px;}
.ex-bloque-timer{background:#0F6E56;color:#fff;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap;}
.ex-bloque-chevron{font-size:11px;color:var(--mu);transition:transform .3s cubic-bezier(.4,0,.2,1);margin-left:8px;display:inline-block;line-height:1;}
.ex-bloque-chevron.open{transform:rotate(0deg);}
.ex-bloque-chevron:not(.open){transform:rotate(-90deg);}
/* Progreso del bloque */
.ex-bloque-prog{font-size:11px;color:var(--mu);font-weight:600;}
/* Tabla de tareas */
.ex-tabla-wrap{display:none;}
.ex-tabla-wrap.open{display:block;}
.ex-tabla-head{display:grid;grid-template-columns:1fr 140px 80px 80px 44px;gap:0;background:transparent;border-top:1px solid var(--br);}
.ex-tabla-head span{font-size:9px;font-weight:500;color:var(--mu);text-transform:uppercase;letter-spacing:.14em;padding:12px 18px;}
.ex-tarea{display:grid;grid-template-columns:1fr 140px 80px 80px 44px;gap:0;border-top:1px solid var(--br);align-items:center;transition:background .18s;}
.ex-tarea:hover{background:rgba(28,26,23,.015);}
.ex-tarea.done{opacity:.45;}
.ex-tarea.done .ex-tnombre{text-decoration:line-through;}
.ex-tcell{padding:12px 14px;font-size:13px;}
.ex-tcell:last-child{padding:10px;display:flex;justify-content:center;}
.ex-tnombre{font-weight:600;font-size:13px;line-height:1.3;}
.ex-tdesc{font-size:11px;color:var(--mu);margin-top:2px;}
.ex-tguia{display:inline-flex;align-items:center;gap:5px;margin-top:9px;font-size:10px;color:var(--mu);background:transparent;padding:5px 12px;border-radius:var(--pill);cursor:pointer;border:1px solid var(--br);font-family:inherit;transition:all .2s;letter-spacing:.03em;}
.ex-tguia:hover{border-color:var(--ink);color:var(--ink);}
.ex-tsets{font-size:12px;color:var(--mu);}
.ex-nivel{display:inline-block;font-size:10px;font-weight:500;padding:4px 11px;border-radius:var(--pill);letter-spacing:.04em;}
.nivel-facil{background:var(--vl);color:var(--vd);}
.nivel-medio{background:var(--al);color:var(--am);}
.nivel-dificil{background:var(--danger-l);color:var(--danger);}
.ex-tcheck{width:20px;height:20px;accent-color:var(--v);cursor:pointer;}
/* Guia modal */
.guia-modal{background:var(--card);border-radius:var(--rad);padding:1.5rem;max-width:440px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.guia-modal h3{font-family:'DM Serif Display',serif;font-size:18px;margin-bottom:.75rem;}
.guia-step{display:flex;gap:10px;font-size:13px;margin-bottom:8px;line-height:1.6;}
.guia-snum{min-width:20px;height:20px;border-radius:50%;background:var(--v);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;}
/* Responsive tabla ejercicio */
@media(max-width:600px){
  .ex-tabla-head{grid-template-columns:1fr 70px 50px 44px;}
  .ex-tabla-head span:nth-child(2){display:none;}
  .ex-tarea{grid-template-columns:1fr 70px 50px 44px;}
  .ex-tcell:nth-child(2){display:none;}
  .ex-tcell{padding:9px 10px;}
}
.chevron{width:14px;height:14px;flex-shrink:0;color:var(--mu);transition:transform .2s;}
.chevron.open{transform:rotate(180deg);}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1.25rem;}
@media(max-width:560px){.hgrid{grid-template-columns:1fr;}}
.hcard{background:var(--card);border:1px solid var(--br);border-top:2px solid var(--v);border-radius:0 0 var(--rad) var(--rad);padding:1.5rem;transition:border-color .2s;}
.hcard:hover{border-color:rgba(28,26,23,.18);border-top-color:var(--v);}
.hcard h4{font-family:'DM Serif Display',serif;font-size:17px;font-weight:400;margin-bottom:10px;line-height:1.25;letter-spacing:-.01em;}
.hcard p{font-size:12.5px;color:var(--mu);line-height:1.75;}


/* ══════════════════════════════════════
   RESPONSIVE — móvil, tablet, desktop
══════════════════════════════════════ */

/* ── NAVEGACIÓN MÓVIL ── */
@media(max-width:600px){
  .hdr{padding:1.25rem 1rem 1.75rem;}
  .hdr h1{font-size:22px;}
  .hdr p{font-size:12px;}
  .hmacros{gap:6px;}
  .hmacro{padding:6px 10px;flex:1;min-width:70px;}
  .hmacro .val{font-size:15px;}
  .hmacro .lbl{font-size:9px;}

  .mbar{padding:.5rem .75rem;}
  .mbar label{font-size:12px;}
  .mchip{font-size:10px;padding:3px 8px;}

  .nav{padding:0;}
  .nbtn{padding:10px 11px;font-size:11px;}

  .main{padding:1rem .75rem 5rem;}
  .stitle{font-size:20px;}
  .ssub{font-size:12px;}
}

/* ── CRONOGRAMA — MÓVIL: lista por semana en lugar de grid 7col ── */
@media(max-width:700px){
  /* Ocultar el grid de 7 columnas */
  .cal{
    display:block;
  }
  .cal-hd{display:none;}
  /* Cada día ocupa el ancho completo */
  .cal-day{
    min-height:auto;
    margin-bottom:8px;
    border-radius:var(--rad);
    padding:12px 14px;
    display:block;
  }
  .cal-day-vacia{display:none;}
  .cal-day-top{margin-bottom:10px;}
  .cal-day .chip{display:inline-block;margin:2px 3px 2px 0;font-size:9.5px;padding:4px 8px;max-width:none;}
  .dnum{font-size:20px;}
  .wkt{font-size:17px;}
}

/* ── CRONOGRAMA — TABLET: 7 col pero más compacto ── */
@media(min-width:701px) and (max-width:900px){
  .cal-day{min-height:130px;padding:5px 4px;}
  .chip{font-size:8px;padding:2px 3px;}
  .dnum{font-size:11px;}
}

/* ── MODAL RECETA — MÓVIL ── */
@media(max-width:600px){
  .modal{max-height:95vh;border-radius:var(--rad) var(--rad) 0 0;}
  .overlay{align-items:flex-end;padding:0;}
  .mtop{padding:.85rem 1rem;}
  .mtop h3{font-size:16px;}
  .mbody{padding:.85rem 1rem;}
  .ing-row{font-size:11px;}
  .step-item{font-size:11px;}
}

/* ── COMPRAS — grids ── */
@media(max-width:600px){
  .ctabs{gap:5px;}
  .ctab{font-size:11px;padding:6px 10px;}
  .mlist-cat-title{font-size:12px;}
  .mlist-item{font-size:12px;flex-wrap:wrap;gap:4px;}
  .mlist-need{font-size:11px;}
}

/* ── INVENTARIO — móvil ── */
@media(max-width:600px){
  .inv-header{flex-direction:column;align-items:flex-start;}
  .inv-summary{gap:5px;}
  .ist{font-size:11px;padding:5px 10px;}
  .inv-ftabs{gap:4px;}
  .inv-ftab{font-size:10px;padding:4px 9px;}
  .stock-row{flex-wrap:wrap;gap:4px;}
  .stock-frac{min-width:auto;font-size:10px;}
  .inv-actions{gap:4px;}
  .qbtn{width:26px;height:26px;font-size:16px;}
  .iact{font-size:10px;padding:3px 7px;}
  .inv-name{font-size:12px;}
  .inv-sbadge{font-size:9px;}
}

/* ── EJERCICIO — móvil ── */
@media(max-width:600px){
  .ex-ch{padding:.75rem .9rem;}
  .ex-dn{font-size:13px;}
  .ex-ds{font-size:10px;}
  .ex-cb{padding:0 .9rem .75rem;}
  .ex-table td{padding:4px 5px;font-size:11px;}
  .ex-badge{font-size:9px;padding:2px 7px;}
}

/* ── HORMONAL — móvil ── */
@media(max-width:560px){
  .hgrid{grid-template-columns:1fr;}
  .hcard{padding:.85rem;}
  .hcard h4{font-size:12px;}
  .hcard p{font-size:11px;}
}

/* ── LOCK SCREEN — móvil ── */
@media(max-width:480px){
  #lockScreen > div{
    padding:1.5rem 1.25rem;
  }
}

/* ── MONTH SELECTOR — scroll horizontal limpio ── */
@media(max-width:600px){
  .mbar-inner{gap:6px;}
  .mchips{
    overflow-x:auto;
    flex-wrap:nowrap;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    padding-bottom:2px;
  }
  .mchips::-webkit-scrollbar{display:none;}
  .sbnr{display:none;} /* ocultar badges temporada en móvil — ahorra espacio */
}

/* ── ADD MODAL — móvil ── */
@media(max-width:500px){
  .add-modal{border-radius:var(--rad) var(--rad) 0 0;}
  #addOverlay{align-items:flex-end;padding:0;}
  .fg-row{grid-template-columns:1fr 1fr;}
  .fg-row .fg:last-child{grid-column:1/3;}
}

/* ── NAVEGACIÓN: tamaño táctil mínimo ── */
@media(max-width:600px){
  .nbtn{min-height:44px;display:flex;align-items:center;}
  .ctab,.inv-ftab,.mchip{min-height:36px;display:inline-flex;align-items:center;}
}

/* ── TABLA SEMANA VISTA SWIPE (cronograma tablet) ── */
@media(min-width:601px) and (max-width:700px){
  .cal{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .cal{grid-template-columns:repeat(7,minmax(90px,1fr));}
}

/* ── DESKTOP — sin cambios ── */
@media(min-width:901px){
  .cal-day{min-height:155px;}
}

/* ─── COMPRAS + INVENTARIO ─── */
.ctabs{display:flex;gap:6px;margin-bottom:1.25rem;}
.ctab{padding:9px 20px;border-radius:var(--pill);border:1px solid var(--br);font-size:12px;font-weight:400;cursor:pointer;background:transparent;color:var(--mu);transition:all .2s;letter-spacing:.02em;font-family:'DM Sans',sans-serif;}
.ctab:hover{border-color:var(--ink);color:var(--ink);}
.ctab.active{background:var(--ink);color:var(--bg);border-color:var(--ink);}

/* Lista de mercado */
.mlist-cat{margin-bottom:.75rem;}
.mlist-cat-count{font-size:11px;color:var(--mu);font-weight:400;}
/* Items mercado */
.mlist-item{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--br);font-size:13px;transition:all .3s ease;}
.mlist-item:last-child{border-bottom:none;}
.mlist-item.bought{opacity:.4;text-decoration:line-through;}
/* Checkbox compra */
.mcb{width:16px;height:16px;accent-color:var(--ink);cursor:pointer;flex-shrink:0;}
/* Nombre y badge tienda */
.mlist-name{flex:1;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.mlist-right{display:flex;align-items:center;gap:8px;white-space:nowrap;}
.mlist-need{font-size:13px;font-weight:400;font-variant-numeric:tabular-nums;letter-spacing:.01em;}
.mlist-need.ok{color:var(--tx);}
.mlist-need.warn{color:var(--am);}
.mlist-need.crit{color:var(--danger);}
/* Badge de tienda */
.tienda-badge{font-size:9px;font-weight:500;padding:4px 10px;border-radius:var(--pill);white-space:nowrap;letter-spacing:.04em;}
